<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Weather Cast </title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="app">
      <div class="title">
         <header>SkySense</header>
      </div>
      <div class="head">
         <header class="nav-section">
            <input id="SearchPlaces" type="search" placeholder="Search for Places">
            <button>Today</button>
            <button>Week</button>
            <button>*C</button>
            <button>*F</button>
            <div class="profile">
               <img src="assets/img24.jpg">
            </div>
         </header>

      </div>
      <div class="sidebar">
         <div>
            <img src="assets/img30.jpg" alt="">
         </div>
         <div>
            <h1>12*C</h1>
            <P>Monday,<span>16:00</span></P>
         </div>
         <div class="weather-details">
            <img src="assets/" alt="">
            <span>Mostly cloudy</span>
         </div>
         <div class="">
              <img src="images/rain.png" alt="">
            <span>Rain - 30%</span>
        </div>

    </div>

    <div class="city-card">
        <img src="images/newyork.jpg" alt="">
        <h3>New York, NY, USA</h3>
    </div>
      </div>

   </div>
   
   
   
   <script src="script.js"></script>
</body>
</html>
