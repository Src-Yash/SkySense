<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

    <link rel="stylesheet" href="style.css">
    <title>SkySense</title>

</head>

<body>
<div class="container">
    <aside class="sidebar">


      <!-- head -->

      <h1>SkySense</h1>
        <!-- Search -->

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" id="search-btn"></i>
            <input id="search-input" type="search" placeholder="Search for places...">
            <i class="fa-solid fa-location-crosshairs"></i>
        </div>

        <!-- Weather Image -->
      
        <div class="weather-image">
            <img id="weather-icon" src="assets/weather/sun.png" alt="weather">
        </div>

        <!-- Temperature -->

        <div class="temperature">
            <h1 id="temperature">12°</h1>
            <span>C</span>
         </div>
         
         <!-- Date -->
         
         <div class="date-time">
            <p class="day">Monday</p>
            <p class="time">16:00</p>
         </div>
         
         <hr>
         
         <!-- Weather Condition -->
         
         <div class="weather-info">
            <div class="condition">
               <i class="fa-solid fa-cloud"></i>
               <span id="weather-condition">Mostly Cloudy</span>
            </div>

            <div class="rain">
                <i class="fa-solid fa-cloud-rain"></i>
                <span id="weather-condition-rain">Rain - 30%</span>
            </div>

        </div>

        <!-- City Image -->

        <div class="city-card">
            <img src="assets/images/city.jpg" alt="city">

            <div class="overlay">
                <h3 id="city-name">New York, USA</h3>
            </div>
        </div>

    </aside>

    <!-- ================= MAIN ================= -->

    <main class="main-content">
        <!-- Top Navigation -->
        <header class="top-bar">
            <div class="tabs">
                <button class="unit">Today</button>
                <button class="active">
                    Week
                </button>

            </div>

            <div class="top-right">
                <button class="unit">
                    °C
                </button>
                <button class="unit">
                    °F
                </button>
                <img src="assets/images/profile.jpg" alt="profile" class="profile">

            </div>

        </header>

        <!-- Forecast -->

        <section class="forecast">
            <!-- Card 1 -->
            <div class="forecast-card">
                <p>Sun</p>
                <img id="weather-icon" src="assets/weather/sun.png">
                <h4>15°-3°</h4>
            </div>
            <!-- Card 2 -->
            <div class="forecast-card">
                <p>Mon</p>
                <img src="assets/weather/rain.png">
                <h4>15°-7°</h4>
            </div>
            <!-- Card 3 -->
            <div class="forecast-card">
                <p>Tue</p>
                <img src="assets/weather/rain.png">
                <h4>9°-7°</h4>
            </div>
            <!-- Card 4 -->
            <div class="forecast-card">
                <p>Wed</p>
                <img src="assets/weather/rain.png">
                <h4>15°-3°</h4>
            </div>
            <!-- Card 5 -->
            <div class="forecast-card">
                <p>Thu</p>
                <img src="assets/weather/wind.png">
                <h4>15°-3°</h4>
            </div>
            <!-- Card 6 -->
            <div class="forecast-card">
                <p>Fri</p>
                <img src="assets/weather/sun.png">
                <h4>15°-3°</h4>
            </div>
            <!-- Card 7 -->
            <div class="forecast-card">
                <p>Sat</p>
                <img src="assets/weather/sun.png">
                <h4>15°-3°</h4>
            </div>
        </section>

        <!-- Highlights -->

        <section class="highlights">
            <h2>Today's Highlights</h2>
            <!-- Cards will be added in Part 2 -->
            <div class="highlight-grid">

                <div class="card">
                    <h3>Humidity</h3>
                    <h1 id="humidity">--%</h1>
                    <h3 id="humidityLevel">--</h3>
                </div>
                <div class="card">
                    <h3 >Wind Speed</h3>
                    <h1 id="windSpeed">-- km/h</h1>
                    <h3 id="speedLevel">--</h3>
                </div>
                <div class="card">
                    <h3>Feels like</h3>
                    <h1 id="feelsLike">--°</h1>
                    <h3 id="feel">--</h3>
                </div>
                <div class="card">
                    <h3>UV Index</h3>
                    <div class="uv-gauge">
                        <canvas id="uvChart"></canvas>
                        <div class="uv-value" id="uvValue">                            
                           --
                       </div> 
                    </div>
                </div>
                <div class="card">
                    <h3>Pressure</h3>
                    <h1 id="pressure">-- mb</h1>
                </div>
                <div class="card">
                    <h3>Visibility</h3>
                    <h1 id="visibility">-- km</h1>
                </div>

            </div>

        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
